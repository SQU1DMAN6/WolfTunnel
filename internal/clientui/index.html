<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>FtR WolfTunnel</title>
<style>
:root{color-scheme:dark;--bg:#11151b;--panel:#1b222c;--panel2:#242e3a;--line:#354252;--text:#e7edf5;--muted:#9aabba;--accent:#76c7d8;--ok:#79d6a3;--bad:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}.menu{height:34px;display:flex;align-items:center;gap:18px;padding:0 12px;background:#0d1116;border-bottom:1px solid var(--line);flex-shrink:0}.brand{font-weight:750;color:var(--accent);letter-spacing:.3px}.menu button{background:none;border:0;color:var(--muted);padding:5px 7px;cursor:pointer}.menu button:hover{color:var(--text);background:var(--panel2)}.tabs{height:43px;display:flex;align-items:stretch;gap:3px;padding:4px 6px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}.tab{display:flex;align-items:center;gap:12px;min-width:100px;max-width:220px;padding:0 10px;border:1px solid transparent;border-radius:6px 6px 0 0;color:var(--muted);cursor:pointer}.tab.active{background:var(--bg);border-color:var(--line);border-bottom-color:var(--bg);color:var(--text)}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.close{border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer}.newtab{padding:0 12px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}.addressrow{display:flex;gap:8px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}.addressrow input{flex:1;min-width:0;background:#0d1116;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px 12px;outline:none}.addressrow input:focus{border-color:var(--accent)}button.primary{background:#246477;color:white;border:1px solid #347e91;border-radius:7px;padding:8px 15px;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer}.main{flex:1;min-height:0;overflow:auto;padding:22px;display:flex;justify-content:center}.view{width:min(920px,100%)}.hero{border:1px solid var(--line);background:linear-gradient(135deg,#19232e,#11151b);border-radius:12px;padding:22px;margin-bottom:16px}.hero h1{font-size:21px;margin:0 0 7px}.muted{color:var(--muted)}.state{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:12px}.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.config{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px}.field input,.field select{background:#0d1116;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px;width:100%}.notice{border-left:3px solid var(--accent);padding:10px 12px;background:var(--panel);color:var(--muted);margin:14px 0}.bottom{height:30px;background:#0d1116;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--muted);font-size:12px;flex-shrink:0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7d8995;margin-right:7px}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none}@media(max-width:600px){.config{grid-template-columns:1fr}.field.full{grid-column:auto}.main{padding:12px}.menu{gap:7px}}
</style>
</head>
<body>
<div class="menu"><span class="brand">FtR WolfTunnel</span><button id="menuNew">File ▾</button><button id="menuConfig">Settings</button><button id="menuAbout">About</button><span style="flex:1"></span><span class="pill">RBI prototype · v0</span></div>
<div class="tabs" id="tabs"></div>
<form class="addressrow" id="searchForm" autocomplete="off"><input id="address" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter a URL or search the web…"><button class="primary" type="submit">Send to Wolf Node</button></form>
<main class="main"><section class="view" id="view"></section></main>
<footer class="bottom"><span><i class="dot" id="dot"></i><span id="connection">Node not tested</span></span><span id="endpoint">129.150.63.22:13300</span><span id="lastState">No request sent</span></footer>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let tabs=[{id:1,title:'New Tab',kind:'home',content:null}],active=1,nextId=2;
let config={host:'129.150.63.22',port:13300,fingerprint:'',token:'',search_engine:'duckduckgo'};
let status={connected:false,message:'Node not tested',last:'No request sent'};
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function current(){return tabs.find(t=>t.id===active)||tabs[0]}
function addTab(kind='home',title='New Tab'){const t={id:nextId++,kind,title,content:null};tabs.push(t);active=t.id;render();if(kind==='config')showConfig();else if(kind==='about')showAbout();else showHome();}
function closeTab(id){if(tabs.length===1){tabs=[{id:nextId++,title:'New Tab',kind:'home',content:null}];active=tabs[0].id;}else{const idx=tabs.findIndex(t=>t.id===id);tabs=tabs.filter(t=>t.id!==id);if(active===id)active=tabs[Math.max(0,idx-1)].id;}render();showCurrent();}
function render(){const host=$('tabs');host.innerHTML='';tabs.forEach(t=>{const el=document.createElement('div');el.className='tab'+(t.id===active?' active':'');el.innerHTML=`<span class="tab-title">${escapeHTML(t.title)}</span><button class="close" title="Close tab" aria-label="Close ${escapeHTML(t.title)}">×</button>`;el.addEventListener('click',e=>{if(e.target.closest('.close'))return;active=t.id;render();showCurrent();});el.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();closeTab(t.id)});host.appendChild(el)});const plus=document.createElement('button');plus.className='newtab';plus.textContent='+';plus.title='New tab';plus.onclick=()=>addTab();host.appendChild(plus);$('endpoint').textContent=`${config.host}:${config.port}`;$('connection').textContent=status.message;$('dot').className='dot'+(status.connected?' ok':status.message==='Node not tested'?'':' bad');$('lastState').textContent=status.last;}
function setContent(html){$('view').innerHTML=html;}
function showHome(){const t=current();t.title=t.content?.title||'New Tab';setContent(`<div class="hero"><h1>WolfTunnel</h1><p class="muted">A remote-browser isolation prototype. The client sends a dummy request to a Wolf Node; v0 does not fetch or render the destination website.</p><div class="row"><span class="pill">Remote execution planned</span><span class="pill">Pixel streaming not enabled</span><span class="pill">No local browsing history in this app</span></div></div><div class="state"><strong>Ready for a relay request</strong><p class="muted">Enter a full URL, a domain name, or search terms above. The Wolf Node will acknowledge the request and return its current v0 state.</p><p class="muted">This view is a status display, not a remote webpage.</p></div>`);render();}
function showConfig(){const t=current();t.title='Configuration';render();setContent(`<div class="hero"><h1>Wolf Node configuration</h1><p class="muted">Settings stay in memory for this client run and are not written to disk.</p></div><div class="config"><div class="field"><label for="host">Wolf Node address</label><input id="host" value="${escapeHTML(config.host)}" autocomplete="off"></div><div class="field"><label for="port">TCP port</label><input id="port" type="number" min="1" max="65535" value="${config.port}"></div><div class="field full"><label for="fingerprint">TLS certificate SHA-256 fingerprint (required)</label><input id="fingerprint" value="${escapeHTML(config.fingerprint)}" placeholder="64 hexadecimal characters" autocomplete="off" spellcheck="false"></div><div class="field full"><label for="token">Wolf Node access token (required)</label><input id="token" type="password" value="${escapeHTML(config.token)}" placeholder="Paste the 32+ character token" autocomplete="new-password"></div><div class="field"><label for="engine">Search engine for plain text</label><select id="engine"><option value="duckduckgo" ${config.search_engine==='duckduckgo'?'selected':''}>DuckDuckGo</option><option value="google" ${config.search_engine==='google'?'selected':''}>Google</option></select></div><div class="field"><label>Protocol</label><input value="WolfTunnelv0 · F00DBEEF" readonly></div></div><div class="notice">The TLS fingerprint must be obtained through a trusted channel. Do not disable fingerprint verification. The access token is sent only inside the encrypted connection.</div><div class="row"><button class="primary" id="saveConfig">Apply in memory</button><button class="secondary" id="testNode">Test connection</button><span class="muted" id="configMessage" role="status"></span></div>`);$('saveConfig').onclick=async()=>{config={host:$('host').value.trim(),port:Number($('port').value),fingerprint:$('fingerprint').value.trim(),token:$('token').value,search_engine:$('engine').value};const r=await api('/api/config',{method:'POST',body:JSON.stringify(config)});$('configMessage').textContent=r.ok?'Configuration applied in memory.':(r.error||'Could not apply configuration');render();};$('testNode').onclick=async()=>{const r=await api('/api/ping',{method:'POST',body:'{}'});$('configMessage').textContent=r.ok?r.state:(r.error||'Connection failed');updateStatus(r.ok,r.ok?r.state:(r.error||'Connection failed'));render();};}
function showAbout(){current().title='About';render();setContent(`<div class="hero"><h1>About WolfTunnel v0</h1><p class="muted">WolfTunnel is a remote-browser-isolation prototype. This build validates a request/acknowledgement protocol and does not yet fetch websites or stream rendered pixels.</p></div><div class="state"><strong>Privacy notes</strong><p class="muted">The encrypted connection protects payload contents, but a network provider may still observe the server IP, port, connection timing and traffic volume. This prototype does not attempt to disguise or camouflage traffic.</p></div>`);}
function showResult(title,result,target){const t=current();t.kind='page';t.title=title;t.content={title,result,target};render();setContent(`<div class="hero"><div class="row"><span class="pill ok">Wolf Node acknowledgement</span><span class="pill">v0 dummy request</span></div><h1>${escapeHTML(title)}</h1><p class="muted">Requested target: ${escapeHTML(target)}</p></div><div class="state"><strong>Relay response</strong><p>${escapeHTML(result.state||'No state returned')}</p><p class="muted">Status: ${escapeHTML(result.status||'unknown')} · Can respond: ${result.can_respond?'yes':'no'}</p><p class="muted">No destination page was fetched or rendered.</p></div>`);}
function updateStatus(ok,message){status.connected=!!ok;status.message=message;status.last=message;render();}
async function api(path,options={}){try{const res=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})},cache:'no-store'});return await res.json()}catch(e){return {ok:false,error:'Local client API unavailable'}}}
function normaliseInput(raw){const s=raw.trim();if(!s)return '';if(/^https?:\/\//i.test(s))return s;if(/^[^\s/]+\.[^\s/]+(?:\/[^\s]*)?$/.test(s))return 'https://'+s;const q=encodeURIComponent(s);return config.search_engine==='google'?'https://www.google.com/search?q='+q:'https://duckduckgo.com/?q='+q;}
$('searchForm').addEventListener('submit',async e=>{e.preventDefault();const raw=$('address').value.trim();if(!raw)return;const target=normaliseInput(raw);const t=current();t.title=raw.length>26?raw.slice(0,23)+'…':raw;t.content=null;setContent(`<div class="hero"><h1>Sending request…</h1><p class="muted">Contacting the configured Wolf Node.</p></div><div class="state">Waiting for acknowledgement. The node will not fetch the destination in v0.</div>`);const r=await api('/api/request',{method:'POST',body:JSON.stringify({input:raw,target,method:config.search_engine})});if(r.ok){updateStatus(true,'Connected · authenticated');showResult(raw,r,target)}else{updateStatus(false,r.error||'Request failed');setContent(`<div class="hero"><span class="pill bad">Request failed</span><h1>Wolf Node unavailable</h1><p class="muted">${escapeHTML(r.error||'No acknowledgement received')}</p></div><div class="state">Check the node address, port, certificate fingerprint, access token and server status in Configuration.</div>`);}});
$('menuNew').onclick=()=>addTab();$('menuConfig').onclick=()=>addTab('config','Configuration');$('menuAbout').onclick=()=>addTab('about','About');
function showCurrent(){const t=current();if(t.kind==='config')showConfig();else if(t.kind==='about')showAbout();else if(t.content)showResult(t.content.title,t.content.result,t.content.target);else showHome();}
async function boot(){const r=await api('/api/config');if(r.config){config={...config,...r.config};}render();showHome();}
boot();
})();
</script>
</body>
</html>
